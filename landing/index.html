<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Influe - 인플루언서를 위한 올인원 관리 앱</title>
  <meta name="description" content="협찬 관리, 정산, 캘린더까지. 인플루언서의 모든 업무를 하나의 앱에서.">
  <meta name="apple-itunes-app" content="app-id=YOUR_APP_ID">
  <link rel="icon" href="icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      text-align: center;
    }

    .icon {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      margin-bottom: 32px;
      box-shadow: 0 20px 60px rgba(255,255,255,0.08);
    }

    h1 {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }

    .tagline {
      font-size: 20px;
      color: #999;
      margin-bottom: 48px;
      line-height: 1.6;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      max-width: 700px;
      width: 100%;
      margin-bottom: 48px;
    }

    .feature {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 24px;
      text-align: left;
    }

    .feature-icon {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .feature h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .feature p {
      font-size: 13px;
      color: #888;
      line-height: 1.5;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      color: #000;
      padding: 16px 32px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255,255,255,0.15);
    }

    .cta svg {
      width: 20px;
      height: 20px;
    }

    footer {
      text-align: center;
      padding: 32px 24px;
      color: #555;
      font-size: 13px;
      border-top: 1px solid #1a1a1a;
    }

    footer a {
      color: #777;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      h1 { font-size: 36px; }
      .tagline { font-size: 16px; }
      .features { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <img src="icon-512.png" alt="Influe" class="icon">
    <p class="tagline">
      인플루언서를 위한 올인원 관리 앱<br>
      협찬, 정산, 일정을 한곳에서
    </p>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">📝</div>
        <h3>협찬 관리</h3>
        <p>브랜드, 금액, 기간, 상태를 한눈에 관리</p>
      </div>
      <div class="feature">
        <div class="feature-icon">💰</div>
        <h3>정산 추적</h3>
        <p>수익 현황과 미정산 내역을 실시간 확인</p>
      </div>
      <div class="feature">
        <div class="feature-icon">📅</div>
        <h3>캘린더</h3>
        <p>협찬 일정과 마감일을 캘린더로 확인</p>
      </div>
      <div class="feature">
        <div class="feature-icon">📊</div>
        <h3>노트 & 릴스</h3>
        <p>콘텐츠 아이디어와 릴스를 정리</p>
      </div>
    </div>

    <a href="https://apps.apple.com/app/influe" class="cta">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
      App Store에서 다운로드
    </a>
  </section>

  <footer>
    <p>&copy; 2026 Hanbyeol Lee. All rights reserved.</p>
    <p style="margin-top: 8px;">
      <a href="mailto:support@influe.app">문의하기</a>
    </p>
  </footer>
</body>
</html>
